# Brain Kit — Codemagic (iOS Capacitor) — MIKE PASTE CHECKLIST (top of file)
# =============================================================================
# Place at GIT REPO ROOT when connecting Codemagic.
#
# ASC app: Brain Kit Practice · Apple ID 6809647241 · bundle com.mikemarshall.brainkit · SKU brainkit001
# APP_STORE_APPLE_ID is WIRED below.
# BEFORE first TestFlight build:
#   [ ] 1. Signing: App Store profile for com.mikemarshall.brainkit
#   [ ] 2. Confirm workflow brain-kit-ios
# Note: ASC API key WTQL9884XY already in Codemagic as "Brain Builder Codemagic" —
# yaml reuses that integration name (cannot register same Key ID twice).
# Codemagic Team integration name must match integrations.app_store_connect below.
# Never put Apple passwords or .p8 contents in this file — use Codemagic Team integrations only.
# PRICES NOT LOCKED — do not invent dollars for Complete IAP.
# =============================================================================

workflows:
  brain-kit-ios:
    name: Brain Kit iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Brain Builder Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mikemarshall.brainkit
      vars:
        # Wired 2026-09-07 — Brain Kit Practice ASC Apple ID
        APP_STORE_APPLE_ID: "6809647241"
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # CapgoNativePurchases.podspec requires 15.0; Cap iOS template defaults to 14.0
        IOS_MIN: "15.0"
      node: 20
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          set -e
          if [ -d ios-wrap ]; then cd ios-wrap; fi
          npm ci || npm install
      - name: Ensure ios platform exists
        script: |
          set -e
          if [ -d ios-wrap ]; then cd ios-wrap; fi
          # Cap add/sync both run `pod install`. Cap template Podfile is platform 14.0;
          # CapgoNativePurchases requires 15.0. So:
          # 1) Hide @capgo during first `cap add ios` so the initial pod install has no Capgo pod.
          # 2) Patch Podfile to 15.0.
          # 3) Restore @capgo and `cap sync` (pod install with Capgo + platform 15.0).
          if [ ! -d ios ]; then
            STASH=/tmp/capgo-stash-$$
            mkdir -p "$STASH"
            if [ -d node_modules/@capgo ]; then
              echo "Stashing @capgo during cap add ios (avoid Capgo vs platform 14.0)"
              mv node_modules/@capgo "$STASH/"
            fi
            npx cap add ios
            bash scripts/patch-ios-deployment-target.sh ios/App
            if [ -d "$STASH/@capgo" ]; then
              mv "$STASH/@capgo" node_modules/
            fi
            rm -rf "$STASH"
          fi
          bash scripts/patch-ios-deployment-target.sh ios/App
          npx cap sync ios
          bash scripts/patch-ios-deployment-target.sh ios/App
          # Privacy manifest stub (local-first)
          if [ -f PrivacyInfo.xcprivacy ] && [ -d ios/App/App ]; then
            cp -n PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy 2>/dev/null \
              || cp PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          fi
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion ${IOS_MIN}" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
          echo "=== Podfile platform line ==="
          grep -n "platform :ios" ios/App/Podfile || true
      - name: CocoaPods
        script: |
          set -e
          if [ -d ios-wrap ]; then cd ios-wrap; fi
          # Belt-and-suspenders: ensure Podfile platform/post_install before explicit pod install
          bash scripts/patch-ios-deployment-target.sh ios/App
          cd ios/App && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          set -e
          if [ -d ios-wrap ]; then cd ios-wrap; fi
          cd ios/App
          # Take the higher of App Store + TestFlight so we never collide with an uploaded build
          # Requires APP_STORE_APPLE_ID numeric
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          AS=${AS:-0}; TF=${TF:-0}
          [ "$AS" = "None" ] && AS=0
          [ "$TF" = "None" ] && TF=0
          LATEST=$AS
          if [ "$TF" -gt "$LATEST" ] 2>/dev/null; then LATEST=$TF; fi
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then LATEST=0; fi
          NEXT=$((LATEST + 1))
          if [ "$NEXT" -lt 1 ]; then NEXT=1; fi
          echo "Using CFBundleVersion=$NEXT (AS=$AS TF=$TF)"
          agvtool new-version -all "$NEXT"
      - name: Build IPA
        script: |
          set -e
          if [ -d ios-wrap ]; then cd ios-wrap; fi
          if [ ! -d ios/App ]; then
            echo "ios/App missing after cap sync" >&2
            ls -la
            exit 1
          fi
          cd ios/App
          # Capacitor layout: workspace lives here as App.xcworkspace
          WS="$XCODE_WORKSPACE"
          if [ ! -e "$WS" ] && [ -e App.xcworkspace ]; then WS=App.xcworkspace; fi
          if [ ! -e "$WS" ]; then
            echo "Workspace not found; listing ios/App:" >&2
            ls -la
            exit 1
          fi
          xcode-project build-ipa --workspace "$WS" --scheme "$XCODE_SCHEME"
    artifacts:
      - ios-wrap/ios/App/build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - miketmarshall94@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
